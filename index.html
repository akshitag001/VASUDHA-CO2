    <script>
      // Landing page only: start the hero illustration with the HTML, choosing the same file the
      // <img srcset> will pick, so phones don't download the desktop size as well.
      if (location.pathname === '%BASE_URL%') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.fetchPriority = 'high'
        l.setAttribute('imagesrcset', '%BASE_URL%img/hero-landscape-sm.webp 800w, %BASE_URL%img/hero-landscape.webp 1600w')
        l.setAttribute('imagesizes', '100vw')
        document.head.appendChild(l)
      }
    </script>
